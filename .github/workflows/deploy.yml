# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*"

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  MODEL_SERVICE_DEPLOY_HOOK_URL: ${{ secrets.MODEL_SERVICE_DEPLOY_HOOK_URL }}

jobs:
  deploy-web:
    name: Deploy Web Application
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Vercel deployment secrets
        id: vercel_check
        run: |
          if [ -n "${VERCEL_TOKEN}" ] && [ -n "${VERCEL_ORG_ID}" ] && [ -n "${VERCEL_PROJECT_ID}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not configured — skipping Vercel deployment. Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to enable it."
          fi

      - name: Build application
        run: pnpm build:web
        env:
          NODE_ENV: production
          # Keep CI build deterministic even when runtime secrets
          # are only configured inside Vercel project settings.
          DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || '******localhost:5432/kosedge' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET != '' && secrets.AUTH_SECRET || 'ci-build-auth-secret-32-chars-minimum' }}
          MODEL_SERVICE_URL: ${{ secrets.MODEL_SERVICE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Deploy to Vercel (Production)
        if: steps.vercel_check.outputs.configured == 'true'
        run: |
          pnpm dlx vercel pull --yes --environment=production --cwd apps/web --token "$VERCEL_TOKEN"
          pnpm dlx vercel build --prod --cwd apps/web --token "$VERCEL_TOKEN"
          pnpm dlx vercel deploy --prebuilt --prod --cwd apps/web --token "$VERCEL_TOKEN"

      - name: Vercel deployment skipped
        if: steps.vercel_check.outputs.configured == 'false'
        run: echo "Vercel deployment skipped — configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID repository secrets to enable it."

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build:** ✅ Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Configure deployment steps above based on your hosting platform." >> $GITHUB_STEP_SUMMARY

  deploy-model-service:
    name: Deploy Model Service
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/kosedge-model-service"
          SHA_TAG="${IMAGE}:sha-${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REF_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_TAG="${IMAGE}:${REF_NAME}"
          else
            RELEASE_TAG="${IMAGE}:latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push model-service image
        uses: docker/build-push-action@v6
        with:
          context: services/model-service
          file: services/model-service/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.release_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger model-service deployment hook
        if: ${{ env.MODEL_SERVICE_DEPLOY_HOOK_URL != '' }}
        env:
          DEPLOY_HOOK: ${{ env.MODEL_SERVICE_DEPLOY_HOOK_URL }}
          IMAGE_TAG: ${{ steps.tags.outputs.sha_tag }}
        run: |
          curl -fsSL -X POST "$DEPLOY_HOOK" \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"$IMAGE_TAG\",\"sha\":\"${GITHUB_SHA}\"}"

      - name: Deployment hook not configured
        if: ${{ env.MODEL_SERVICE_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "Model-service image was published to GHCR but deploy hook is not configured."
          echo "Set MODEL_SERVICE_DEPLOY_HOOK_URL to trigger your runtime deployment."

      - name: Model Service Deployment Summary
        run: |
          echo "## Model Service Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ steps.tags.outputs.sha_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** ${{ steps.tags.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
