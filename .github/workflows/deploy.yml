# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  # Vercel production deploys are handled by the Vercel ↔ GitHub integration.
  # This job verifies the web build on main/tags and surfaces a deploy summary.
  verify-web:
    name: Verify Web Build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build:web
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          MODEL_SERVICE_URL: ${{ secrets.MODEL_SERVICE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Deployment Summary
        run: |
          {
            echo "## Deployment Summary"
            echo "- **Branch:** ${{ github.ref }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Web build:** ✅ Successful"
            echo "- **Vercel:** Deployed by Vercel GitHub integration (not this workflow)"
            echo "- **Railway:** See \`deploy-model-service\` job when \`RAILWAY_TOKEN\` is set"
          } >> "$GITHUB_STEP_SUMMARY"

  # Railway hosts services/model-service. Requires repo secrets:
  #   RAILWAY_TOKEN (required), RAILWAY_SERVICE_ID (recommended)
  deploy-model-service:
    name: Deploy Model Service (Railway)
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      vars.ENABLE_RAILWAY_DEPLOY == 'true'
    timeout-minutes: 25
    needs: verify-web

    defaults:
      run:
        working-directory: services/model-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN secret is missing; skipping Railway deploy."
            exit 1
          fi
          if [ -n "${RAILWAY_SERVICE_ID:-}" ]; then
            railway up --service "$RAILWAY_SERVICE_ID" --ci --detach
          else
            railway up --ci --detach
          fi

      - name: Railway Summary
        run: |
          {
            echo "## Railway deploy"
            echo "- **Service path:** \`services/model-service\`"
            echo "- **Healthcheck:** \`/health\`"
            echo "- Remember to set \`MODEL_SERVICE_URL\` on Vercel to the Railway public URL."
          } >> "$GITHUB_STEP_SUMMARY"
