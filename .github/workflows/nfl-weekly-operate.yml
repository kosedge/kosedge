# NFL weekly operate — invoke-only.
#
# Platform Reliability owns enabling the Tuesday cron / Beat / launchd.
# This workflow must stay workflow_dispatch until they turn the schedule on.
# Do not also enable Railway + launchd from this change.
#
# t4141u: research pin may remain the preseason lock. Operate week is
# resolved from the canonical schedule (or --week) and must not skip ingest
# solely because the pin is preseason.
name: NFL Weekly Operate

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Finished REG week (empty = resolve from schedule; 0 = preseason skip ingest)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run (plan + read-only; never flips research pin)"
        type: boolean
        default: true
  # Enable when Season Week ≥ 1 (Tuesday after MNF, 12:30 UTC):
  # schedule:
  #   - cron: "30 12 * * 2"

jobs:
  weekly-operate:
    name: Weekly operate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run weekly operate
        run: |
          WEEK="${{ github.event.inputs.week }}"
          DRY="${{ github.event.inputs.dry_run }}"
          ARGS=(--last-run data/ops/nfl-weekly-operate-last.json)
          if [[ -n "${WEEK}" ]]; then
            ARGS+=(--week "$WEEK")
          fi
          if [[ "${DRY}" != "false" ]]; then
            ARGS+=(--dry-run)
          fi
          python scripts/nfl/run_weekly_operate.py "${ARGS[@]}"

      - name: Confirm research pin untouched
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          # Pin must match HEAD — do not require the preseason lock forever.
          before = subprocess.check_output(
              ["git", "show", "HEAD:data/ops/nfl-web-launch-bundle.json"], text=True
          )
          after = Path("data/ops/nfl-web-launch-bundle.json").read_text(encoding="utf-8")
          assert after == before, "weekly operate must not write the research pin"
          p = json.loads(after)
          assert p.get("locked_snapshot") is True
          print("pin unchanged", p.get("lock_tag"))
          PY
