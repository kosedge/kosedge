# Deploy model-service (api + worker + beat) to Railway on push to deploy-vercel.
#
# Project brave-art — all three services use:
#   railway up services/model-service --path-as-root
#   Dockerfile + PROCESS_TYPE=api|worker|beat
#
# GitHub secret: RAILWAY_TOKEN (Railway → brave-art → Settings → Tokens → Project Token)
# Optional: RAILWAY_ENVIRONMENT, RAILWAY_SERVICE_API / _WORKER / _BEAT, RAILWAY_PROJECT_ID
#
# Known CI failure mode: RAILWAY_TOKEN with trailing newline/control chars →
# "failed to parse header value". Sanitize before every railway call.

name: Deploy Railway model-service

on:
  push:
    branches: [deploy-vercel]
    paths:
      - "services/model-service/**"
      - "services/data-platform-nfl/src/data_platform_nfl/**"
      - "infra/db/**"
      - ".github/workflows/deploy-railway.yml"
  workflow_dispatch:

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: true

env:
  # brave-art (from Railway dashboard / GitHub deployment URLs)
  RAILWAY_PROJECT_ID_DEFAULT: da3d68f8-d925-462f-b262-c4ef3e488245
  RAILWAY_ENVIRONMENT_ID_DEFAULT: 4bf00465-0220-4764-8b3b-e7adce18ca64

jobs:
  deploy:
    name: Railway up (api / worker / beat)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "${RAILWAY_TOKEN:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "${TOKEN}" ]; then
            echo "Missing secret: RAILWAY_TOKEN" >&2
            echo "Create a Project Token in Railway → brave-art → Settings → Tokens" >&2
            exit 1
          fi
          if printf '%s' "${TOKEN}" | grep -q '[[:cntrl:]]'; then
            echo "RAILWAY_TOKEN contains control characters after sanitize." >&2
            echo "Re-paste the Project Token in GitHub → Settings → Secrets (no quotes/newlines)." >&2
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "Railway token present (length=${#TOKEN})."

      - name: Sync vendored data_platform_nfl
        run: bash scripts/nfl/sync-model-service-vendor.sh

      - name: Stage NFL K/DST artifact into model-service image context
        run: bash scripts/nfl/stage_nfl_kdst_into_model_service.sh

      - name: Stage Camp Desk into model-service image context
        run: bash scripts/nfl/stage_camp_desk_into_model_service.sh

      - name: Stage infra/db SQL migrations into model-service image context
        run: bash scripts/db/stage_migrations_into_model_service.sh

      - name: Setup Python (migration integrity + optional status gate)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: SQL migration integrity (repo-only; no production DDL)
        run: |
          python -m pip install --upgrade pip
          pip install -r services/model-service/requirements.txt
          python scripts/db/migrate.py check-integrity

      # Live status gate is DISABLED by default so the first merge (runner only)
      # can deploy without a circular dependency on an unbaselined warehouse.
      # Enable GitHub Actions variable MIGRATION_STATUS_GATE_ENABLED=true ONLY AFTER:
      #   1) this runner is deployed to Railway, AND
      #   2) production baseline --through 054 (with confirmation tokens) succeeds.
      # Never auto-apply DDL. Absent WAREHOUSE_DATABASE_URL is stated honestly.
      - name: SQL migration status gate (read-only; opt-in after cutover)
        env:
          WAREHOUSE_DATABASE_URL: ${{ secrets.WAREHOUSE_DATABASE_URL }}
          MIGRATION_STATUS_GATE_ENABLED: ${{ vars.MIGRATION_STATUS_GATE_ENABLED }}
        run: |
          set -euo pipefail
          GATE="$(printf '%s' "${MIGRATION_STATUS_GATE_ENABLED:-false}" | tr '[:upper:]' '[:lower:]' | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "${GATE}" != "true" ]; then
            echo "Migration status gate DISABLED (cutover / first-merge safe)."
            echo "Repo check-integrity already ran. Live status --require-current is NOT enforced."
            echo "Enable Actions variable MIGRATION_STATUS_GATE_ENABLED=true ONLY AFTER"
            echo "runner deploy + production baseline through 054. CI will not auto-apply DDL."
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          EVENT="${{ github.event_name }}"
          SQL_CHANGED=0
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            # Fail closed for manual runs once the gate is enabled.
            SQL_CHANGED=1
            echo "workflow_dispatch: treating SQL scope as in-scope (fail closed)."
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            # First push / missing before SHA — fail closed once enabled.
            SQL_CHANGED=1
            echo "missing/zero before SHA: treating SQL scope as in-scope (fail closed)."
          elif git diff --name-only "${BEFORE}" "${SHA}" | grep -q '^infra/db/.*\.sql$'; then
            SQL_CHANGED=1
          fi

          URL="$(printf '%s' "${WAREHOUSE_DATABASE_URL:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "${URL}" ]; then
            echo "::error::MIGRATION_STATUS_GATE_ENABLED=true but WAREHOUSE_DATABASE_URL is unset."
            echo "CI cannot verify live warehouse migration status and will NOT auto-apply DDL."
            echo "Set a read-only WAREHOUSE_DATABASE_URL secret, or disable the gate variable."
            exit 1
          fi

          echo "::add-mask::${URL}"
          export DATABASE_URL="${URL}"
          # Always require-current when gate enabled (closes quiet-pending trap).
          python scripts/db/migrate.py status --require-current
          if [ "${SQL_CHANGED}" = "1" ]; then
            echo "SQL scope in-scope for this event; status --require-current passed."
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.2.0

      - name: Bake deploy git SHA into model-service image context
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > services/model-service/.deploy-git-sha
          echo "baked $(cat services/model-service/.deploy-git-sha | cut -c1-12) -> services/model-service/.deploy-git-sha"

      - name: Deploy api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          SVC: ${{ secrets.RAILWAY_SERVICE_API }}
        run: |
          set -euo pipefail
          export RAILWAY_TOKEN="$(printf '%s' "${RAILWAY_TOKEN:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "::add-mask::${RAILWAY_TOKEN}"
          ENV_ID="$(printf '%s' "${RAILWAY_ENVIRONMENT:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          PROJECT_ID="$(printf '%s' "${RAILWAY_PROJECT_ID:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SVC_NAME="$(printf '%s' "${SVC:-model-service}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          # --ci streams build logs and fails the job if the image does not
          # build/deploy. --detach only uploads and left depth-sot 404 after #291/#292.
          railway up services/model-service --path-as-root --no-gitignore --ci \
            --project "${PROJECT_ID:-${RAILWAY_PROJECT_ID_DEFAULT}}" \
            --environment "${ENV_ID:-${RAILWAY_ENVIRONMENT_ID_DEFAULT}}" \
            --service "${SVC_NAME}" \
            -m "ci ${GITHUB_SHA::12} api"

      # Smoke immediately after API so worker/beat log-stream failures cannot skip it.
      - name: DepthSot deploy smoke (e253 must not 404; auth must match)
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          EXPECTED_GIT_SHA: ${{ github.sha }}
          MODEL_BASE: https://model-service-production-e253.up.railway.app
          RAILWAY_API_SERVICE_ID: e0c54f94-3ee0-41c0-8081-e96d3e246a4a
          DEPTH_SOT_SMOKE_WAIT_SECONDS: "420"
          DEPTH_SOT_REQUIRE_AUTH_OK: "1"
        run: bash scripts/ci/railway-depth-sot-deploy-smoke.sh

      - name: Deploy worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          SVC: ${{ secrets.RAILWAY_SERVICE_WORKER }}
        run: |
          set -euo pipefail
          export RAILWAY_TOKEN="$(printf '%s' "${RAILWAY_TOKEN:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "::add-mask::${RAILWAY_TOKEN}"
          ENV_ID="$(printf '%s' "${RAILWAY_ENVIRONMENT:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          PROJECT_ID="$(printf '%s' "${RAILWAY_PROJECT_ID:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SVC_NAME="$(printf '%s' "${SVC:-model-service-worker}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          railway up services/model-service --path-as-root --no-gitignore --ci \
            --project "${PROJECT_ID:-${RAILWAY_PROJECT_ID_DEFAULT}}" \
            --environment "${ENV_ID:-${RAILWAY_ENVIRONMENT_ID_DEFAULT}}" \
            --service "${SVC_NAME}" \
            -m "ci ${GITHUB_SHA::12} worker"

      - name: Deploy beat
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          SVC: ${{ secrets.RAILWAY_SERVICE_BEAT }}
        run: |
          set -euo pipefail
          export RAILWAY_TOKEN="$(printf '%s' "${RAILWAY_TOKEN:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          echo "::add-mask::${RAILWAY_TOKEN}"
          ENV_ID="$(printf '%s' "${RAILWAY_ENVIRONMENT:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          PROJECT_ID="$(printf '%s' "${RAILWAY_PROJECT_ID:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SVC_NAME="$(printf '%s' "${SVC:-model-service-beat}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          railway up services/model-service --path-as-root --no-gitignore --ci \
            --project "${PROJECT_ID:-${RAILWAY_PROJECT_ID_DEFAULT}}" \
            --environment "${ENV_ID:-${RAILWAY_ENVIRONMENT_ID_DEFAULT}}" \
            --service "${SVC_NAME}" \
            -m "ci ${GITHUB_SHA::12} beat"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Railway deploy"
            echo "- **Branch:** ${{ github.ref_name }}"
            echo "- **Commit:** ${{ github.sha }}"
            echo "- **Services:** model-service / model-service-worker / model-service-beat"
            echo "- **API service id (expected):** e0c54f94-3ee0-41c0-8081-e96d3e246a4a"
            echo "- **e253:** https://model-service-production-e253.up.railway.app"
            echo "- **Smoke (after API):** /health 200 + non-null git_sha; ping/status no header → 401; with x-kosedge-secret → 200"
            echo "- **Auth env/header:** INTERNAL_API_SECRET / x-kosedge-secret (same key on api e0c54f94 + worker b8b3329e)"
            echo "- **401-with-secret:** Railway var ≠ GH Actions INTERNAL_API_SECRET (do not rotate a new key mid-cutover)"
            echo "- **git_sha:** baked into image as \`.deploy-git-sha\` (railway up does not inject commit)"
            echo "- **Note:** \`railway up --detach\` is upload-only and is not a pass"
            echo "- **Migrations:** repo \`check-integrity\` always; live \`status --require-current\` only when \`MIGRATION_STATUS_GATE_ENABLED=true\` AND \`WAREHOUSE_DATABASE_URL\` is set (never auto-apply DDL; gate off for first-merge cutover)"
            echo "- **Staged SQL:** \`scripts/db/stage_migrations_into_model_service.sh\` → \`/app/infra/db\`"
          } >> "$GITHUB_STEP_SUMMARY"
