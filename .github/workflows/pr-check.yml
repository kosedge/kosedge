# .github/workflows/pr-check.yml
name: PR Checks

# GitHub still opens a "PR Checks" run on push (merge to deploy-vercel, feature
# pushes). The file is pull_request-only, so those runs used to fail in 0s and
# look like a broken deploy. Push is an explicit no-op; real work stays on PRs.
# Production typecheck/build lives in production-gate.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "**"

jobs:
  skip-on-push:
    name: Push is not a PR check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "PR Checks is pull_request-only."
          echo "Production bar: Production Gate + Production Smoke on deploy-vercel."

  pr-checks:
    name: PR Quality Checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: paths
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t ALL < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD || true)
          WEB=0
          MS=0
          CFB_MS=0
          NBA_MS=0
          WNBA_MS=0
          NHL_MS=0
          NFL_MS=0
          NFL_SCRIPTS=0
          DB_MIG=0
          for f in "${ALL[@]:-}"; do
            case "$f" in
              apps/web/*|packages/*) WEB=1 ;;
              services/model-service/src/services/cfb_*/*|services/model-service/tests/test_cfb_*|services/model-service/src/routes/cfb.py)
                MS=1
                CFB_MS=1
                ;;
              services/model-service/src/services/nba_*/*|services/model-service/tests/test_nba_*|services/model-service/src/routes/nba.py|scripts/nba/*|docs/NBA_GRADE*|data/nba_grades*|data/ops/nba-grades-summary*)
                MS=1
                NBA_MS=1
                ;;
              services/model-service/src/services/wnba_season_engine/*|services/model-service/tests/test_wnba_*|services/model-service/src/routes/wnba.py|services/model-service/src/services/wnba_publish_policy.py|scripts/wnba/build_team_prior_ch1.py|scripts/wnba/build_roster_minutes_ch2.py|scripts/wnba/build_player_projection_ch5.py|scripts/wnba/build_situation_ch3.py|scripts/wnba/build_kei_ch4.py|scripts/wnba/build_props_ch6_dark.py|scripts/wnba/grade_harness.py|docs/WNBA_CH*|docs/WNBA_GRADE*|data/wnba_grades*|data/ops/wnba-grades-summary*)
                MS=1
                WNBA_MS=1
                ;;
              services/model-service/src/services/nhl_data.py|services/model-service/src/services/nhl_season_engine/*|services/model-service/tests/test_nhl_*|scripts/nhl/*|docs/NHL_*|docs/NHL_GRADE*|data/nhl_grades*|data/ops/nhl-grades-summary*)
                MS=1
                NHL_MS=1
                ;;
              services/model-service/src/services/nfl_*/*|services/model-service/tests/test_nfl_*|services/model-service/src/routes/nfl*)
                MS=1
                NFL_MS=1
                ;;
              services/model-service/src/db_migrations/*|services/model-service/tests/test_db_migrations.py|scripts/db/*|infra/db/*)
                MS=1
                DB_MIG=1
                ;;
              services/model-service/*)
                MS=1
                ;;
              scripts/nfl/*|data/ops/nfl*|content/writers/camp-desk-2026/*) NFL_SCRIPTS=1 ;;
              infra/db/*|scripts/db/*)
                DB_MIG=1
                ;;
            esac
          done
          # CFB/NBA/WNBA/NHL-only model-service PRs must not be blocked by NFL DepthSot / camp desk
          # date coupling. NFL Truth Layer still runs when NFL paths (or nfl_ops) change.
          # DB migration-only changes skip NFL truth (no model/edge changes).
          if [ "$NFL_MS" = "0" ] && [ "$NFL_SCRIPTS" = "0" ] && { [ "$CFB_MS" = "1" ] || [ "$NBA_MS" = "1" ] || [ "$WNBA_MS" = "1" ] || [ "$NHL_MS" = "1" ] || [ "$DB_MIG" = "1" ]; }; then
            NFL_TRUTH=0
          elif [ "$MS" = "1" ] || [ "$NFL_SCRIPTS" = "1" ]; then
            NFL_TRUTH=1
          else
            NFL_TRUTH=0
          fi
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "model_service=$MS" >> "$GITHUB_OUTPUT"
          echo "cfb_ms=$CFB_MS" >> "$GITHUB_OUTPUT"
          echo "nba_ms=$NBA_MS" >> "$GITHUB_OUTPUT"
          echo "wnba_ms=$WNBA_MS" >> "$GITHUB_OUTPUT"
          echo "nhl_ms=$NHL_MS" >> "$GITHUB_OUTPUT"
          echo "nfl_ms=$NFL_MS" >> "$GITHUB_OUTPUT"
          echo "nfl_ops=$NFL_SCRIPTS" >> "$GITHUB_OUTPUT"
          echo "nfl_truth=$NFL_TRUTH" >> "$GITHUB_OUTPUT"
          echo "db_mig=$DB_MIG" >> "$GITHUB_OUTPUT"
          echo "Changed paths: web=$WEB model_service=$MS cfb_ms=$CFB_MS nba_ms=$NBA_MS wnba_ms=$WNBA_MS nhl_ms=$NHL_MS nfl_ms=$NFL_MS nfl_ops=$NFL_SCRIPTS nfl_truth=$NFL_TRUTH db_mig=$DB_MIG (${#ALL[@]} files)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (changed files vs base)
        # Repo-wide prettier debt on deploy-vercel tip must not block PRs whose
        # own changed files are already formatted. Full `pnpm format:check` stays
        # available locally for cleanup sweeps.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE"...HEAD \
              | grep -E '\.(js|jsx|ts|tsx|mjs|cjs|json|md|yml|yaml|css|scss|html|mdx)$' \
              || true
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Prettier-scoped files changed; skipping format check."
            exit 0
          fi
          echo "Checking ${#FILES[@]} changed file(s) with Prettier…"
          pnpm exec prettier --check "${FILES[@]}"

      - name: Run linter (web changes only)
        if: steps.paths.outputs.web == '1'
        # Base tip has known eslint debt; full `pnpm lint` fails any web PR.
        # Mirror Prettier: lint only files this PR changed under apps/web.
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE"...HEAD \
              | grep -E '^apps/web/.*\.(js|jsx|ts|tsx|mjs|cjs)$' \
              || true
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No apps/web JS/TS files changed; skipping eslint."
            exit 0
          fi
          echo "Linting ${#FILES[@]} changed web file(s)…"
          pnpm --filter @kosedge/web exec eslint "${FILES[@]#apps/web/}"

      - name: Skip linter (no web changes)
        if: steps.paths.outputs.web != '1'
        run: echo "No apps/web or packages changes — skipping pnpm lint (base tip has known eslint debt)."

      - name: Run type check (web changes only)
        if: steps.paths.outputs.web == '1'
        run: pnpm typecheck

      - name: Skip type check (no web changes)
        if: steps.paths.outputs.web != '1'
        run: echo "No web changes — skipping pnpm typecheck (Production Gate still runs typecheck+build)."

      - name: Enforce web Python boundary policy
        run: pnpm check:web-python-boundary

      - name: Run tests (web changes only)
        if: steps.paths.outputs.web == '1'
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AUTH_SECRET: test-secret-key-at-least-32-characters-long-for-testing
          MODEL_SERVICE_URL: http://localhost:8000

      - name: Critical-path coverage gate (web changes only)
        if: steps.paths.outputs.web == '1'
        run: pnpm test:web:critical
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AUTH_SECRET: test-secret-key-at-least-32-characters-long-for-testing

      - name: Setup Python
        if: steps.paths.outputs.model_service == '1' || steps.paths.outputs.nfl_ops == '1' || steps.paths.outputs.db_mig == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Always install when nfl_ops or model-service changes — invariants need numpy
      # even if DepthSot pytest is skipped (ops-doc-only PRs were failing KICKOFF_SMOKE).
      - name: Install model-service Python deps
        if: steps.paths.outputs.model_service == '1' || steps.paths.outputs.nfl_ops == '1' || steps.paths.outputs.db_mig == '1'
        run: |
          python -m pip install --upgrade pip
          pip install -r services/model-service/requirements.txt pytest

      - name: SQL migration integrity + runner tests (no production DB)
        if: steps.paths.outputs.db_mig == '1' || steps.paths.outputs.model_service == '1'
        run: |
          python scripts/db/migrate.py check-integrity
          cd services/model-service
          pytest -q tests/test_db_migrations.py
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run CFB enterprise / season-engine tests
        if: steps.paths.outputs.cfb_ms == '1'
        run: |
          cd services/model-service
          pytest -q tests/test_cfb_enterprise_gates.py tests/test_cfb_power_sot.py tests/test_cfb_futures.py tests/test_cfb_kei.py

      - name: Run NBA season-engine tests
        if: steps.paths.outputs.nba_ms == '1'
        run: |
          cd services/model-service
          pytest -q tests/test_nba_team_prior_ch1.py tests/test_nba_roster_minutes_ch2.py tests/test_nba_player_projection_ch5.py tests/test_nba_situation_ch3.py tests/test_nba_kei_ch4.py tests/test_nba_props_ch6.py tests/test_nba_fantasy_ch7.py tests/test_nba_grade_harness.py

      - name: Run WNBA season-engine tests
        if: steps.paths.outputs.wnba_ms == '1'
        run: |
          cd services/model-service
          pytest -q tests/test_wnba_team_prior_ch1.py tests/test_wnba_roster_minutes_ch2.py tests/test_wnba_player_projection_ch5.py tests/test_wnba_situation_ch3.py tests/test_wnba_kei_ch4.py tests/test_wnba_props_ch6.py tests/test_wnba_fantasy_ch7.py tests/test_wnba_grade_harness.py

      - name: Run NHL fetcher / season-engine tests
        if: steps.paths.outputs.nhl_ms == '1'
        run: |
          cd services/model-service
          pytest -q tests/test_nhl_fetcher.py tests/test_nhl_team_prior_ch1.py tests/test_nhl_toi_grid_ch2.py tests/test_nhl_player_projection_ch5.py tests/test_nhl_situation_ch3.py tests/test_nhl_kei_ch4.py tests/test_nhl_props_ch6.py tests/test_nhl_fantasy_ch7.py tests/test_nhl_grade_harness.py

      - name: Run model-service DepthSot / NFL tests
        if: steps.paths.outputs.nfl_ms == '1' || (steps.paths.outputs.model_service == '1' && steps.paths.outputs.cfb_ms != '1' && steps.paths.outputs.nba_ms != '1' && steps.paths.outputs.wnba_ms != '1' && steps.paths.outputs.nhl_ms != '1' && steps.paths.outputs.db_mig != '1')
        run: |
          cd services/model-service
          # Prefer targeted DepthSot / auth / week-1 in-process remat contracts; fall back to full suite.
          if ls tests/test_nfl_camp_sot_queue.py tests/test_nfl_depth_sot_ops_auth.py >/dev/null 2>&1; then
            pytest -q tests/test_nfl_camp_sot_queue.py tests/test_nfl_depth_sot_ops_auth.py tests/test_nfl_props_in_process_remat_ops.py
          else
            pytest -q
          fi
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          INTERNAL_API_SECRET: test-internal-secret

      - name: NFL Truth Layer invariants (block publish)
        if: steps.paths.outputs.nfl_truth == '1'
        run: |
          python scripts/nfl/check_nfl_invariants.py
          # Acceptance: deliberate I3 break must fail the job
          if python scripts/nfl/check_nfl_invariants.py --deliberate-break I3; then
            echo "Expected deliberate I3 break to fail" >&2
            exit 1
          fi
          # Week 1 complete slate — schedule pack == 16; no silent drops
          python scripts/nfl/check_edge_board_week1.py
          # Futures conservation C1–C6 + ceiling soft-pile guard
          python scripts/nfl/check_season_sim_conservation.py --n-path-replicates 500

      - name: Skip NFL Truth Layer (CFB/NBA/WNBA-only model-service)
        if: steps.paths.outputs.model_service == '1' && steps.paths.outputs.nfl_truth != '1'
        run: |
          echo "CFB/NBA/WNBA-only model-service diff — skipping NFL DepthSot/invariants (Law 7: do not touch NFL)."

      - name: Comment PR with results
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(function (comment) {
              return comment.user.type === "Bot" && comment.body.includes("## PR Checks");
            });
            const jobStatus = "${{ job.status }}";
            const success = jobStatus === "success";
            const mark = success ? "passed" : "failed";
            const body = [
              "## PR Checks",
              "",
              success ? "All checks passed." : "Some checks failed.",
              "",
              "- Formatting (changed files)",
              "- Lint / typecheck / web tests (when apps/web or packages change)",
              "- Model-service DepthSot tests + NFL invariants (when model-service / nfl ops change)",
              "",
              success ? "Ready for review." : "Please fix the failing checks before merging. (" + mark + ")",
            ].join("\n");
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
