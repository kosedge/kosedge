# .github/workflows/pr-check.yml
name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run linter
        run: pnpm lint

      - name: Run type check
        run: pnpm typecheck

      - name: Enforce web Python boundary policy
        run: pnpm check:web-python-boundary

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AUTH_SECRET: test-secret-key-at-least-32-characters-long-for-testing
          MODEL_SERVICE_URL: http://localhost:8000

      - name: Critical-path coverage gate
        run: pnpm test:web:critical
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          AUTH_SECRET: test-secret-key-at-least-32-characters-long-for-testing

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run model-service tests
        run: |
          python -m pip install --upgrade pip
          pip install -r services/model-service/requirements.txt pytest
          cd services/model-service
          pytest -q

      - name: NFL Truth Layer invariants (block publish)
        run: |
          python scripts/nfl/check_nfl_invariants.py
          # Acceptance: deliberate I3 break must fail the job
          if python scripts/nfl/check_nfl_invariants.py --deliberate-break I3; then
            echo "Expected deliberate I3 break to fail" >&2
            exit 1
          fi
          # Week 1 complete slate — schedule pack == 16; no silent drops
          python scripts/nfl/check_edge_board_week1.py
          # Futures conservation C1–C6 + ceiling soft-pile guard
          python scripts/nfl/check_season_sim_conservation.py --n-path-replicates 500

      - name: Comment PR with results
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('## PR Checks')
            );

            const jobStatus = '${{ job.status }}';
            const success = jobStatus === 'success';
            const status = success ? '✅' : '❌';
            const body = `## PR Checks

${status} **${success ? 'All checks passed!' : 'Some checks failed.'}**

- ✅ Formatting check
- ✅ Linting
- ✅ Type checking
- ✅ Tests

${success ? 'Ready for review!' : 'Please fix the failing checks before merging.'}`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
