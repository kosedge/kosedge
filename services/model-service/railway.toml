# Brave-art: GHA `railway up services/model-service --path-as-root`.
# Keep dashboard rootDirectory empty when using path-as-root (no double nest).
# Nested copy Dockerfile retained as fallback if rootDirectory is re-set.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/health"
healthcheckTimeout = 120
