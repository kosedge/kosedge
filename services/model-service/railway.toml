# Railway config for the Kos Edge model service.
# In the Railway dashboard for this service, set:
#   Root Directory: /services/model-service
#   Config File:    /services/model-service/railway.toml
# Connect the kosedge/kosedge GitHub repo so pushes auto-deploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/services/model-service/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Railway injects PORT; Dockerfile CMD reads ${PORT:-8000}
