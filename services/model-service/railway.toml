# Brave-art model-service: GHA uses
#   railway up services/model-service --path-as-root
# Dashboard rootDirectory is ALSO services/model-service, so Metal resolves
# Dockerfile at services/model-service/Dockerfile *inside* the uploaded tree
# (= nested path). Keep services/model-service/Dockerfile in sync with ./Dockerfile.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/health"
healthcheckTimeout = 30
