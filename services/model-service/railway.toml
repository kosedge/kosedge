# Brave-art: ALWAYS `railway up services/model-service --path-as-root`.
# Keep dashboard rootDirectory EMPTY with path-as-root (no double nest).
#
# API service only: healthcheck /health on PORT 8080, PROCESS_TYPE=api.
# Worker/beat MUST use railway.worker.json / railway.beat.json (no /health).
# See docs/RAILWAY_SEASON_OPS.md — data refresh is Celery beat, not redeploy.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
healthcheckPath = "/health"
healthcheckTimeout = 120
