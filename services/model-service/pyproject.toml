[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kosedge-model-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "celery==5.4.0",
  "redis==5.0.8",
  "python-dotenv==1.0.1",
  "SQLAlchemy==2.0.32",
  "psycopg[binary]==3.2.1",
  "requests==2.32.3",
  "httpx==0.27.2",
  "tenacity==9.0.0",
  "structlog==24.4.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]